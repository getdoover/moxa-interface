[project]
name = "moxa-interface"
version = "0.1.0"
description = "Allows other Doover apps to publish/receive configurable information to/from one or more Moxa i/o hubs via ethernet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydoover>=0.4.13",
]

[project.scripts]
doover-app-run = "moxa_interface:main"
export-config = "moxa_interface.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
